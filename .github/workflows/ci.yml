name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/openfix
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-placeholder-secret
      GITHUB_CLIENT_ID: ci-placeholder-client-id
      GITHUB_CLIENT_SECRET: ci-placeholder-client-secret
      GROQ_API_KEY: ci-placeholder-groq-key
      GITHUB_PERSONAL_TOKEN: ci-placeholder-github-token
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
